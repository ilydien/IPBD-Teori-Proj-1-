services:
  postgres-prefect:
    image: docker.io/postgres:17-alpine3.23
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
    volumes:
      - ./prefect_app/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 5s
      timeout: 5s
      retries: 5

  dragonfly:
    image: ghcr.io/dragonflydb/dragonfly:v1.38.0
    expose:
      - 6379
    restart: always
    volumes:
      - ./prefect_app/dragonfly:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command:
      [
        "--proactor_threads=2",
        "--maxmemory=512mb",
        "--bind=0.0.0.0",
        "--port=6379",
      ]

  prefect-server:
    image: docker.io/prefecthq/prefect:3-latest
    depends_on:
      postgres-prefect:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@postgres-prefect:5432/prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_SERVER_UI_API_URL: http://${HOST_IP-127.0.0.1}:4200/api
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: dragonfly
      PREFECT_REDIS_MESSAGING_PORT: 6379
      PREFECT_REDIS_MESSAGING_DB: 0
    env_file: .env
    command: prefect server start --no-services
    ports:
      - "${HOST_IP-127.0.0.1}:4200:4200"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://${HOST_IP-127.0.0.1}:4200/api/health', timeout=1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  prefect-services:
    image: docker.io/prefecthq/prefect:3-latest
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@postgres-prefect:5432/prefect
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: dragonfly
      PREFECT_REDIS_MESSAGING_PORT: 6379
      PREFECT_REDIS_MESSAGING_DB: 0
    command: prefect server services start

  prefect-worker:
    image: docker.io/prefecthq/prefect:3-latest
    working_dir: /prefect
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_WORKING_DIR: /prefect
    volumes:
      - ./prefect_app/app:/prefect:z
    command: prefect worker start --pool local-pool
    restart: on-failure

  garage:
    image: docker.io/dxflrs/garage:v2.3.0
    restart: always
    environment:
      GARAGE_RPC_SECRET: "${GARAGE_RPC_SECRET-garagerpcsecretgaragerpcsecretgaragerpcsecretgaragerpcsecretgara}"
      GARAGE_ADMIN_SECRET: "${GARAGE_ADMIN_SECRET-superadminsecret}"
      GARAGE_DEFAULT_BUCKET: "${GARAGE_BUCKET-lakebucket}"
      GARAGE_DEFAULT_ACCESS_KEY: "GK${GARAGE_DEFAULT_ACCESS_KEY-garagedefaultaccesskeygaragedefa}"
      GARAGE_DEFAULT_SECRET_KEY: "${GARAGE_DEFAULT_SECRET_KEY-garagedefaultsecretkeygaragedefaultsecretkeygaragedefaultsecretk}"
    env_file: .env
    ports:
      - "${HOST_IP-127.0.0.1}:3900:3900"
      - "${HOST_IP-127.0.0.1}:3901:3901"
    volumes:
      - ./lakehouse/garage/etc:/etc
      - ./lakehouse/garage/var/lib/garage/meta:/var/lib/garage/meta
      - ./lakehouse/garage/var/lib/garage/data:/var/lib/garage/data
    command: /garage server --single-node --default-bucket

  garage-webui:
    image: docker.io/khairul169/garage-webui:1.1.0
    container_name: garage-webui
    restart: unless-stopped
    volumes:
      - ./lakehouse/garage/etc/garage.toml:/etc/garage.toml:ro
    ports:
      - "${HOST_IP-127.0.0.1}:3909:3909"
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"

  postgres-lakehouse:
    image: docker.io/postgres:18.3-alpine3.23
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_LAKEHOUSE_USER-postgres}
      POSTGRES_DB: ${POSTGRES_LAKEHOUSE_DB-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_LAKEHOUSE_PASSWORD-postgres}
    env_file: .env
    ports:
      - "${HOST_IP-127.0.0.1}:5433:5432"
    volumes:
      - ./lakehouse/postgres:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_LAKEHOUSE_USER} -d ${POSTGRES_LAKEHOUSE_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  metabase:
    image: docker.io/metabase/metabase:v0.59.6
    container_name: metabase
    hostname: metabase
    volumes:
      - /dev/urandom:/dev/random:ro
    ports:
      - ${HOST_IP-127.0.0.1}:3000:3000
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB-metabaseappdb}
      MB_DB_PORT: 5432
      MB_DB_USER: ${METABASE_USER-metabase}
      MB_DB_PASS: ${METABASE_PASSWORD-mysecretpassword}
      MB_DB_HOST: postgres-metabase
    env_file: .env
    networks:
      - metanet1
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5

  postgres-metabase:
    image: docker.io/postgres:17-alpine3.23
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_USER: ${METABASE_USER-metabase}
      POSTGRES_DB: ${METABASE_DB-metabaseappdb}
      POSTGRES_PASSWORD: ${METABASE_PASSWORD-mysecretpassword}
    env_file: .env
    volumes:
      - ./metabase:/var/lib/postgresql/data
    networks:
      - metanet1

networks:
  metanet1:
    driver: bridge
