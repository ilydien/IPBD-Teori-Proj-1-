services:
  postgres:
    image: docker.io/postgres:17-alpine3.23
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: ghcr.io/dragonflydb/dragonfly:v1.38.0
    command:
      [
        "--proactor_threads=2",
        "--maxmemory=512mb",
        "--bind=0.0.0.0",
        "--port=6379"
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prefect-server:
    image: docker.io/prefecthq/prefect:3-latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@postgres:5432/prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_SERVER_UI_API_URL: http://localhost:4200/api
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: redis
      PREFECT_REDIS_MESSAGING_PORT: 6379
      PREFECT_REDIS_MESSAGING_DB: 0
    command: prefect server start --no-services
    ports:
      - "4200:4200"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:4200/api/health', timeout=1)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  prefect-services:
    image: docker.io/prefecthq/prefect:3-latest
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@postgres:5432/prefect
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: redis
      PREFECT_REDIS_MESSAGING_PORT: 6379
      PREFECT_REDIS_MESSAGING_DB: 0
    command: prefect server services start

  prefect-worker:
    image: docker.io/prefecthq/prefect:3-latest
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    command: prefect worker start --pool local-pool
    restart: on-failure

  garage:
    image: docker.io/dxflrs/garage:v2.2.0
    restart: always
    env_file:
      - .env
    ports:
      - "${HOST_IP}:3900:3900"
      - "${HOST_IP}:3901:3901"
    volumes:
      - ./garage_data/etc:/etc
      - ./garage_data/var/lib/garage/meta:/var/lib/garage/meta
      - ./garage_data/var/lib/garage/data:/var/lib/garage/data

  postgres-lakehouse:
    image: docker.io/postgres:18.3-alpine3.23
    restart: always
    env_file:
      - .env
    ports:
      - "${HOST_IP}:5433:5432"  # ganti biar gak bentrok
    volumes:
      - ./postgres_data/silver:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  metabase:
    image: docker.io/metabase/metabase:v0.59.6
    container_name: metabase
    hostname: metabase
    volumes:
      - /dev/urandom:/dev/random:ro
    ports:
      - ${HOST_IP-127.0.0.1}:3000:3000
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB-metabaseappdb}
      MB_DB_PORT: 5432
      MB_DB_USER: ${METABASE_USER-metabase}
      MB_DB_PASS: ${METABASE_PASSWORD-mysecretpassword}
      MB_DB_HOST: postgres-metabase
    env_file: .env
    networks:
      - metanet1
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5

  postgres-metabase:
    image: docker.io/postgres:17-alpine3.23
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_USER: ${METABASE_USER-metabase}
      POSTGRES_DB: ${METABASE_DB-metabaseappdb}
      POSTGRES_PASSWORD: ${METABASE_PASSWORD-mysecretpassword}
    env_file: .env
    volumes:
      - ./metabase:/var/lib/postgresql/data
    networks:
      - metanet1

volumes:
  postgres_data:
  redis_data:

networks:
  metanet1:
    driver: bridge
